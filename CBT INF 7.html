<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CBT – Latihan SAS Informatika</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--blue:#0b3fc5;--blue2:#1d5bf0;--ink:#0f1f4d;--muted:#6b7a99;--bg:#eef2fb;--card:#fff;--line:#e6ebf5;--green:#16a34a;--red:#dc2626;--orange:#f08c00;--purple:#7c4dff;--fs:1}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Poppins','Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ===== shell ===== */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1500px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 10px 40px rgba(20,40,110,.08)}
.side{background:#fff;padding:18px 12px 12px;display:flex;flex-direction:column;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;padding:0 6px 18px}
.logo .mk{display:grid;grid-template-columns:repeat(3,10px);gap:2px}
.logo .mk i{width:10px;height:10px;display:block;border-radius:2px}
.logo b{display:block;font-size:24px;line-height:1;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#e2362b,#f59f00 55%,#1d5bf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:12px;color:#333;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 14px;border-radius:10px;font-size:14.5px;color:#27324f;text-align:left;font-weight:500}
.nav button:hover{background:#f1f5ff}
.nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px rgba(11,63,197,.35)}
.promo{margin-top:auto;background:#eef4ff;border:1px solid #dbe6ff;border-radius:14px;padding:14px 12px;text-align:center}
.promo svg{width:100%;max-width:150px;height:auto}
.promo b{display:block;color:var(--blue);font-size:14.5px;margin-top:6px}
.promo span{display:block;color:#475569;font-size:13px}
.main{padding:16px 22px 22px;min-width:0;background:#f7f9ff}
.top{display:flex;align-items:center;gap:18px;margin-bottom:14px;position:relative}
.top h1{margin:0;font-size:28px;color:#0b3aa8;font-weight:800;line-height:1.1}
.top .sub{color:#4b5a7a;font-size:13px;margin-top:3px}
.burger{display:none;border:0;background:#fff;border-radius:10px;width:42px;height:42px;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,40,110,.1)}
.search{position:relative;margin-left:auto;width:min(300px,28vw)}
.search input{width:100%;border:1px solid #dbe3f3;background:#fff;border-radius:10px;padding:11px 40px 11px 14px;outline:none}
.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(29,91,240,.12)}
.search .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#44506d;width:18px;height:18px;pointer-events:none}
.pop{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(20,40,110,.18);z-index:40;min-width:260px;max-width:92vw;max-height:60vh;overflow:auto}
.pop .it{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid #f0f3fa}
.pop .it:hover{background:#f4f7ff}
.pop .it b{display:block;font-size:13px}.pop .it span{font-size:12px;color:var(--muted)}
.pop .hd{padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line);font-size:13px}
.search .pop{left:0;right:auto;width:100%}
.ibtn{position:relative;border:0;background:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#27324f}
.ibtn:hover{background:#eaf0ff}
.ibtn .bd{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;border-radius:50%;font-size:10px;width:17px;height:17px;display:flex;align-items:center;justify-content:center;font-weight:700}
.user{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;position:relative}
.user .nm{font-weight:700;font-size:14px;line-height:1.2}.user .rl{font-size:12px;color:var(--muted)}
.av{border-radius:50%;overflow:hidden;background:#dbe7ff;flex:none;display:block}
.av svg{width:100%;height:100%;display:block}
.foot{background:linear-gradient(90deg,#0a35b0,#1457e0);color:#fff;display:flex;align-items:center;gap:30px;padding:16px 24px;font-size:13px;grid-column:1/-1;flex-wrap:wrap}
.foot span{display:flex;align-items:center;gap:10px}
.foot .cp{margin-left:auto;font-size:12px;opacity:.95}
/* ===== dashboard ===== */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:16px}
.dcol{display:flex;flex-direction:column;gap:16px;min-width:0}
.rcol{display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(20,40,110,.04)}
.card h3{margin:0 0 10px;font-size:14.5px}
.banner{position:relative;border-radius:16px;overflow:hidden;color:#fff;min-height:200px;background:radial-gradient(circle at 80% 30%,#2f7bff 0,transparent 55%),linear-gradient(100deg,#0a37b6 0%,#1355e0 60%,#2a73ff 100%);padding:34px 30px;display:flex;align-items:center}
.banner:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:22px 22px;opacity:.5}
.banner .tx{position:relative;z-index:2;max-width:300px}
.banner h2{margin:0 0 8px;font-weight:600;font-size:20px;line-height:1.2}
.banner h2 b{display:block;font-size:26px;font-weight:700}
.banner p{margin:0 0 16px;font-size:13.5px;opacity:.95}
.btn-w{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--blue);border:0;border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.btn-w .ic{width:18px;height:18px}
.art{position:absolute;right:0;top:0;bottom:0;width:62%;z-index:1}
.art svg.pp{position:absolute;right:0;bottom:0;height:100%;width:100%}
.glass{position:absolute;background:rgba(255,255,255,.92);color:#12214d;border-radius:12px;padding:10px 14px;box-shadow:0 10px 24px rgba(0,20,100,.28);font-size:11px;z-index:3}
.glass b{display:block;font-size:19px;line-height:1.2}
.g-time{left:34%;top:14px;display:flex;gap:8px;align-items:flex-start}
.g-time .ic{color:#1d5bf0;width:16px;height:16px;margin-top:2px}
.g-score{right:4%;bottom:18px;min-width:112px}
.g-score b{color:#12214d}
.g-score svg{width:100%;height:28px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qc{border-radius:14px;padding:14px;border:1px solid transparent}
.qc .r{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.qc .ico{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);position:relative}
.qc .ico .ic{width:28px;height:28px}
.qc b{display:block;font-size:14px}.qc span.s{font-size:12px;color:#4b5a7a;line-height:1.25;display:block}
.qc button.go{width:100%;border:0;border-radius:8px;padding:9px 12px;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.qc button.go .ic{width:16px;height:16px}
.q1{background:#eaf1ff;border-color:#d8e5ff}.q1 .ico{color:#1d4ed8}.q1 .go{background:#1d4ed8}
.q2{background:#eaf8f0;border-color:#d3f0e0}.q2 .ico{color:#16a34a}.q2 .go{background:#16a34a}
.q3{background:#f1ecff;border-color:#e2d8ff}.q3 .ico{color:#7c4dff}.q3 .go{background:#7c4dff}
.q4{background:#fff3e6;border-color:#ffe3c2}.q4 .ico{color:#f08c00}.q4 .go{background:#f08c00}
.live-b{position:absolute;bottom:-6px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 7px;border-radius:5px;letter-spacing:.5px}
.perf-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.perf-h h3{margin:0}
.perf-h select{border:0;background:none;font-size:12px;color:#44506d;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.st{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:44px 1fr;gap:0 10px;align-items:center}
.st .ico{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;grid-row:span 2}
.st .ico .ic{width:22px;height:22px}
.st b{font-size:24px;line-height:1.1}.st .lb{font-size:12px;color:var(--muted)}
.st .dl{grid-column:1/-1;margin-top:10px;font-size:11.5px;color:var(--muted)}
.up{color:#16a34a;font-weight:600}.dn{color:#dc2626;font-weight:600}
.charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.chart{width:100%;height:auto;display:block}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;min-height:150px;padding:10px}
.legend{display:flex;flex-direction:column;gap:9px;font-size:12.5px;flex:1}
.legend div{display:flex;align-items:center;gap:8px}.legend i{width:8px;height:8px;border-radius:50%;display:block}.legend b{margin-left:auto}
.donutw{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.donutw svg{width:140px;height:140px;flex:none}
.pf{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pf b{font-size:14px;display:block}.pf span{font-size:12px;color:#44506d;display:block}
.bar{height:7px;border-radius:5px;background:#e3e9f6;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1d5bf0,#3b82f6);border-radius:5px}
.pfp{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;font-weight:500}
.card .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.card .hdr h3{margin:0}.card .hdr a{font-size:12px;color:var(--blue2);cursor:pointer;text-decoration:underline}
.ut{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #f0f3fa;font-size:12.5px}
.ut:first-of-type{border-top:0}
.ut .d{width:34px;text-align:center;line-height:1.1;flex:none}.ut .d b{display:block;font-size:17px}.ut .d span{font-size:10px;color:var(--muted);font-weight:600}
.ut .t{flex:1;min-width:0}.ut .t b{display:block;font-size:12.5px}.ut .t span{color:var(--muted);font-size:11.5px}
.tag{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:600;white-space:nowrap}
.tag.live{background:#e5f7ec;color:#16a34a}.tag.up{background:#fff0dc;color:#d97706}.tag.done{background:#e8efff;color:#1d4ed8}.tag.pu{background:#efe9ff;color:#7c4dff}
.ann{background:#eef4ff;border-radius:10px;padding:12px;display:flex;gap:10px;font-size:12px;align-items:flex-start;min-height:70px}
.ann .ic{color:var(--blue);width:30px;height:30px;flex:none}.ann b{display:block;font-size:12.5px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots button{width:6px;height:6px;border-radius:50%;border:0;background:#cbd5e8;padding:0}.dots button.on{background:var(--blue2)}
.resume{background:#fff7e6;border:1px solid #ffe0a3;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.resume b{flex:1;min-width:200px}
/* ===== generic pages ===== */
.pg-h{display:flex;align-items:center;gap:12px;margin:2px 0 14px;flex-wrap:wrap}
.pg-h h2{margin:0;font-size:22px}
.pg-h .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;background:var(--blue2);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:var(--blue);border-color:#c9d8fb}
.btn.red{background:var(--red)}.btn.grn{background:var(--green)}.btn.gray{background:#eef2fb;color:#27324f}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn .ic{width:17px;height:17px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.info-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{background:#eef4ff;color:var(--blue);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:15px;height:15px}
ul.ls{margin:8px 0 0;padding-left:20px}ul.ls li{margin:6px 0}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld label{font-size:12.5px;font-weight:600;color:#33415f}
.fld input,.fld select{border:1px solid #d3dcf0;border-radius:10px;padding:10px 12px;background:#fff;outline:none;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(29,91,240,.12)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:12px 0}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue2)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:#f2f6ff;text-align:left;padding:10px;font-size:12px;color:#33415f}
table.tb td{padding:10px;border-top:1px solid var(--line)}
.tbw{overflow-x:auto}
.hb{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.hb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);min-width:0}
.hb i{display:block;width:100%;max-width:38px;background:linear-gradient(180deg,#3b82f6,#1d5bf0);border-radius:6px 6px 0 0;min-height:3px}
.hb b{color:var(--ink);font-size:11px}
.mrow{margin:10px 0}.mrow .l{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.mat h3{color:var(--blue);display:flex;gap:8px;align-items:center}
.mat p,.mat li{font-size:13.5px}
.mat code,.qtxt code,.ot code{background:#eef2fb;border-radius:5px;padding:1px 6px;font-family:ui-monospace,Consolas,monospace;font-size:.92em;color:#0b3aa8}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,#dbe7ff,transparent 50%),radial-gradient(circle at 90% 90%,#e5dcff,transparent 50%),var(--bg)}
.login .box{background:#fff;border-radius:20px;padding:30px;width:min(430px,100%);box-shadow:0 20px 60px rgba(20,40,110,.18)}
.login h1{font-size:23px;margin:14px 0 2px;color:#0b3aa8}
.login p{color:var(--muted);margin:0 0 18px;font-size:13px}
/* ===== exam ===== */
.exam{min-height:100vh;display:flex;flex-direction:column;background:#f4f7fd;font-size:calc(14px*var(--fs))}
.etop{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:30}
.etop .logo{padding:0}.etop .logo b{font-size:20px}.etop .logo small{font-size:10px}
.etop .ttl{flex:1;min-width:0}.etop .ttl b{display:block;font-size:16px;color:#0b3aa8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.etop .ttl span{font-size:12px;color:var(--muted)}
.timer{display:flex;align-items:center;gap:8px;background:#eaf1ff;color:var(--blue);border-radius:12px;padding:8px 16px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;border:1px solid #cfe0ff}
.timer .ic{width:20px;height:20px}
.timer.warn{background:#fff1f1;color:#dc2626;border-color:#ffc9c9;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.fsz{display:flex;gap:4px}.fsz button{border:1px solid #d3dcf0;background:#fff;border-radius:8px;width:34px;height:34px;font-weight:700}
.ebody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px 20px;max-width:1400px;margin:0 auto;width:100%}
.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 2px 12px rgba(20,40,110,.05);display:flex;flex-direction:column;min-width:0}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.qno{background:var(--blue);color:#fff;border-radius:10px;padding:6px 14px;font-weight:700}
.badge{background:#eef4ff;color:var(--blue);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.badge.fl{background:#fff0dc;color:#d97706}
.qtxt{font-size:1.1em;line-height:1.6;margin:4px 0 12px;white-space:pre-line}
.qimg{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:8px 0 14px;cursor:zoom-in;background:#fff;image-rendering:auto}
.hint{font-size:12.5px;color:#d97706;background:#fff7e6;border-radius:8px;padding:6px 10px;display:inline-block;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;border:1.5px solid #dbe3f3;border-radius:12px;padding:12px 14px;cursor:pointer;background:#fff;transition:.12s;user-select:none}
.opt:hover{border-color:#8fb0ff;background:#f6f9ff}
.opt .lt{width:32px;height:32px;border-radius:50%;background:#eef2fb;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#33415f}
.opt.sq .lt{border-radius:8px}
.opt .ot{padding-top:4px;line-height:1.5}
.opt.sel{border-color:var(--blue2);background:#eaf1ff}
.opt.sel .lt{background:var(--blue2);color:#fff}
.rv .opt{cursor:default}.rv .opt:hover{background:#fff;border-color:#dbe3f3}
.opt.ok{border-color:#22c55e;background:#ecfdf3}.opt.ok .lt{background:#22c55e;color:#fff}
.opt.bad{border-color:#ef4444;background:#fef2f2}.opt.bad .lt{background:#ef4444;color:#fff}
.opt .mk{margin-left:auto;font-size:11.5px;font-weight:700;padding-top:6px;white-space:nowrap}
.opt.ok .mk{color:#16a34a}.opt.bad .mk{color:#dc2626}
table.bs{width:100%;border-collapse:collapse;border:1px solid #d3dcf0;border-radius:10px;overflow:hidden}
table.bs th{background:#eaf1ff;color:var(--blue);padding:10px;font-size:.9em}
table.bs td{border-top:1px solid #e3e9f6;padding:10px 12px}
table.bs th:not(:first-child),table.bs td:not(:first-child){text-align:center;width:84px}
.rd{width:26px;height:26px;border-radius:50%;border:2px solid #b6c4e4;background:#fff;position:relative;padding:0}
.rd:hover{border-color:var(--blue2)}
.rd.on{border-color:var(--blue2);background:var(--blue2);box-shadow:inset 0 0 0 4px #fff}
.rv .rd{cursor:default}
.rd.ok{border-color:#22c55e;background:#22c55e;box-shadow:inset 0 0 0 4px #fff}.rd.bad{border-color:#ef4444;background:#ef4444;box-shadow:inset 0 0 0 4px #fff}
.rd.key{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
tr.sok td:first-child{border-left:4px solid #22c55e}tr.sbad td:first-child{border-left:4px solid #ef4444}
.clr{align-self:flex-start;margin-top:12px;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.qnav{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.qnav .mid{margin:0 auto}
.flagbtn{border:1.5px solid #f6c37a;background:#fff8ec;color:#c2680a;border-radius:10px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.flagbtn.on{background:#f59f00;color:#fff;border-color:#f59f00}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;align-self:start;position:sticky;top:76px;box-shadow:0 2px 12px rgba(20,40,110,.05)}
.panel h3{margin:0 0 4px;font-size:15px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.nums button{height:42px;border-radius:10px;border:1.5px solid #d3dcf0;background:#fff;font-weight:600;position:relative;padding:0}
.nums button:hover{border-color:var(--blue2)}
.nums button.ans{background:#1d5bf0;color:#fff;border-color:#1d5bf0}
.nums button.flg{background:#f59f00;border-color:#f59f00;color:#fff}
.nums button.cur{outline:3px solid #9bbcff;outline-offset:1px}
.lgd{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12px;color:#44506d;margin-bottom:12px}
.lgd span{display:flex;align-items:center;gap:6px}.lgd i{width:14px;height:14px;border-radius:4px;border:1.5px solid #d3dcf0;display:block}
.lgd .a{background:#1d5bf0;border-color:#1d5bf0}.lgd .f{background:#f59f00;border-color:#f59f00}.lgd .c{border-color:#9bbcff;box-shadow:0 0 0 2px #cfe0ff}
.pbar{margin:10px 0 14px}
.pnl-x{display:none}
.mobbar{display:none}
/* result */
.res{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.rhead{background:linear-gradient(100deg,#0a37b6,#1b66f0);color:#fff;border-radius:18px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.rhead:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.4px);background-size:22px 22px;opacity:.5}
.rhead>*{position:relative}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:38px;line-height:1}.ring .v span{font-size:12px;opacity:.9}
.rhead h2{margin:0 0 4px;font-size:22px}
.stt{display:inline-block;margin:8px 0;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.stt.ok{background:#22c55e}.stt.no{background:#f59e0b}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.sc b{display:block;font-size:24px}.sc span{font-size:12px;color:var(--muted)}
.sc.g b{color:#16a34a}.sc.r b{color:#dc2626}.sc.y b{color:#d97706}.sc.b b{color:var(--blue2)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.flt button{border:1px solid #d3dcf0;background:#fff;border-radius:999px;padding:7px 16px;font-weight:600;font-size:13px}
.flt button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.rq{margin-bottom:14px;font-size:14px}
.rq .qcard{padding:18px}
.stbadge{padding:4px 12px;border-radius:8px;font-size:12px;font-weight:700}
.stbadge.benar{background:#dcfce7;color:#15803d}.stbadge.salah{background:#fee2e2;color:#b91c1c}.stbadge.kosong{background:#f1f5f9;color:#475569}
.pemb{background:#f0f6ff;border-left:4px solid var(--blue2);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13.5px}
.pemb b{color:var(--blue)}
.ans-line{font-size:13px;margin-top:10px}
/* modal / toast */
.ovl{position:fixed;inset:0;background:rgba(10,20,50,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#fff;border-radius:18px;padding:24px;width:min(460px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:90vh;overflow:auto}
.mdl h3{margin:0 0 8px;font-size:19px}
.mdl .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mdl.alert{border-top:6px solid #ef4444;text-align:center}
.mdl.alert .big{font-size:46px;line-height:1}
.sumg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sumg div{background:#f3f6fd;border-radius:10px;padding:10px;text-align:center}.sumg b{display:block;font-size:20px}.sumg span{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f1f4d;color:#fff;padding:11px 20px;border-radius:12px;z-index:200;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.lbx{cursor:zoom-out}.lbx img{max-width:96vw;max-height:90vh;background:#fff;border-radius:10px;image-rendering:auto}
.drawer-bg{display:none}
/* ===== responsive ===== */
@media(max-width:1180px){
 .dash{grid-template-columns:1fr}
 .rcol{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
 .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:980px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 40px rgba(0,0,0,.2)}
 .side.open{transform:none}
 .drawer-bg.open{display:block;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:80}
 .burger{display:flex}
 .charts{grid-template-columns:1fr}
 .quick{grid-template-columns:repeat(2,1fr)}
 .ebody{grid-template-columns:1fr;padding:12px}
 .panel{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:18px 18px 0 0;z-index:60;max-height:78vh;overflow:auto;transform:translateY(110%);transition:.25s;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
 .panel.open{transform:none}
 .pnl-x{display:flex;justify-content:space-between;align-items:center}
 .pnl-x button{border:0;background:#eef2fb;border-radius:50%;width:32px;height:32px}
 .mobbar{display:flex}
 .sg{grid-template-columns:repeat(3,1fr)}
 .etop .fsz{display:none}
}
@media(max-width:640px){
 .main{padding:12px}
 .top{flex-wrap:wrap;gap:10px}
 .top h1{font-size:21px}
 .top .tt{flex:1;min-width:0}
 .search{order:9;width:100%;margin:0}
 .user .tx2{display:none}
 .banner{padding:22px 18px 150px;align-items:flex-start}
 .banner .tx{max-width:none}
 .art{width:100%;top:auto;height:150px}
 .g-time{display:none}
 .g-score{right:12px;bottom:12px}
 .stats{grid-template-columns:1fr 1fr}.st{grid-template-columns:1fr;gap:6px}.st .ico{grid-row:auto}
 .grid2,.grid3{grid-template-columns:1fr}
 .foot{gap:10px;padding:14px 16px;font-size:12px}.foot .cp{margin-left:0}
 .qcard{padding:16px}
 .etop{padding:8px 12px;gap:8px}.etop .logo{display:none}
 .timer{font-size:16px;padding:6px 12px}
 .ebody{padding-bottom:84px}
 .qnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,40,110,.1);display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
 .qnav .btn{padding:11px 14px}
 .qnav .lbl{display:none}
 .qnav .mid{margin:0}
 .flagbtn{width:100%;justify-content:center;padding:10px 8px}
 .nums{grid-template-columns:repeat(5,1fr)}
 .rhead{grid-template-columns:1fr;text-align:center;justify-items:center}
 .sg{grid-template-columns:repeat(2,1fr)}
 table.bs th:not(:first-child),table.bs td:not(:first-child){width:62px}
 .opt{padding:10px}
}
@media print{
 .side,.top,.foot,.flt,.btn,.etop,.drawer-bg,.noprint{display:none!important}
 body{background:#fff}.res{max-width:none;padding:0}
 .rq{break-inside:avoid}.rhead{color:#000;background:#fff;border:1px solid #ccc}.rhead:before{display:none}
}

.navtoggle{display:none}
@media(max-width:980px){.navtoggle{display:inline-flex}}
@media(max-width:640px){.hide-m{display:none}}

</style>

{n:1,t:'pg',topic:1,text:`Kecepatan sepeda Dimas adalah 12,5 km/jam. Data tersebut termasuk data ....`,opts:[`kualitatif`,`kuantitatif kontinu`,`kuantitatif diskrit`,`bukan data`],key:['B'],exp:`Kecepatan diperoleh dari mengukur dan dapat berbentuk pecahan/desimal (12,5), sehingga termasuk data kuantitatif kontinu.`},
{n:2,t:'pg',topic:1,text:`Kotak pertemuan antara kolom dan baris, tempat satu data ditulis, disebut ....`,opts:[`judul`,`Name Box`,`sel`,`tabel`],key:['C'],exp:`Perpotongan antara kolom dan baris yang menjadi tempat satu data disebut sel.`},
{n:3,t:'pg',topic:1,text:`Sebuah tabel vertikal di Excel disusun dari sel A1 dengan 6 kolom. Judul kolom ada di baris 1 dan data 12 siswa ditulis di baris-baris berikutnya. Alamat sel paling kanan bawah yang berisi data adalah ....`,opts:[`F13`,`F12`,`L13`,`13F`],key:['A'],exp:`6 kolom dari A berarti kolom A–F, jadi kolom paling kanan adalah F. Baris 1 berisi judul dan 12 data ada di baris 2–13, sehingga sel paling kanan bawah adalah F13.`},
{n:4,t:'pg',topic:1,text:`Sebuah toko mencatat: (1) merek ponsel, (2) jumlah ponsel yang terjual, (3) berat ponsel dalam gram, dan (4) warna ponsel. Urutan jenis data yang tepat adalah ....`,opts:[`kualitatif, kontinu, diskrit, kualitatif`,`kualitatif, diskrit, kontinu, kualitatif`,`diskrit, kualitatif, kontinu, kualitatif`,`kualitatif, diskrit, kualitatif, kontinu`],key:['B'],exp:`Merek = kualitatif; jumlah terjual = diskrit (hasil menghitung); berat = kontinu (hasil mengukur); warna = kualitatif.`},
{n:5,t:'pg',topic:1,text:`Seorang siswa mencatat banyaknya ayam di empat kandang: 12, 15, 9, dan 20 ekor. Ia menyimpulkan bahwa data tersebut adalah data kuantitatif kontinu karena berupa angka. Evaluasi yang paling tepat terhadap kesimpulan siswa tersebut adalah ....`,opts:[`Benar, karena semua data yang berupa angka adalah data kontinu.`,`Benar, karena banyaknya ayam dapat dinyatakan dalam bentuk desimal.`,`Salah, karena data yang berupa angka termasuk data kualitatif.`,`Salah, karena banyaknya ayam diperoleh dengan menghitung dan berupa bilangan bulat, sehingga termasuk data diskrit`],key:['D'],exp:`Banyaknya ayam diperoleh dengan menghitung dan berupa bilangan bulat, jadi termasuk data diskrit. Tidak semua data angka bersifat kontinu.`},
{n:6,t:'pg',topic:2,img:'img1',text2:`Hasil dari rumus =MAX(B2:B7) adalah ....`,opts:[`65`,`80`,`90`,`480`],key:['C'],exp:`Nilai pada B2:B7 adalah 70, 85, 90, 65, 80, 90. Nilai terbesarnya 90.`},
{n:7,t:'pg',topic:2,img:'img1',text2:`Hasil dari rumus =AVERAGE(B2:B7) adalah ....`,opts:[`80`,`82,5`,`85`,`90`],key:['A'],exp:`Jumlah = 70+85+90+65+80+90 = 480. Rata-rata = 480 ÷ 6 = 80.`},
{n:8,t:'pg',topic:2,img:'img2',text2:`Hasil dari rumus =MEDIAN(B2:B8) adalah ....`,opts:[`26`,`28`,`30`,`36`],key:['B'],exp:`Data diurutkan: 26, 27, 28, 28, 30, 35, 36. Dari 7 data, nilai tengah (data ke-4) adalah 28.`},
{n:9,t:'pg',topic:2,img:'img3',text2:`Kelompok Eka ingin menggambarkan uang saku yang "paling umum" bagi kelima siswa pada tabel. Pilihan yang paling tepat beserta alasannya adalah ....`,opts:[`MEDIAN, hasilnya 12, karena tidak terpengaruh nilai ekstrem 54.`,`AVERAGE, hasilnya 20, karena memakai semua data.`,`MAX, hasilnya 54, karena nilai paling besar.`,`SUM, hasilnya 100, karena total semua uang saku`],key:['A'],exp:`Data terurut: 10, 11, 12, 13, 54. Median = 12 dan tidak terpengaruh nilai ekstrem 54, sehingga paling menggambarkan uang saku yang umum. Rata-rata (20) ditarik naik oleh 54.`},
{n:10,t:'pg',topic:2,img:'img4',text2:`Bu Sari menyimpulkan, "Kelas A dan Kelas B sama baiknya karena rata-rata keduanya 80." Penilaian yang paling tepat terhadap kesimpulan tersebut adalah ....`,opts:[`Tepat, karena rata-rata yang sama berarti kemampuan siswa sama.`,`Tepat, karena median kedua kelas sama-sama 80.`,`Kurang tepat, karena median Kelas A lebih tinggi daripada Kelas B.`,`Kurang tepat, karena median Kelas B (85) lebih tinggi dan rata-ratanya tertarik turun oleh satu nilai rendah (55)`],key:['D'],exp:`Kelas A: rata-rata 80, median 80. Kelas B (55, 85, 85, 85, 90): rata-rata 80 tetapi median 85. Rata-rata Kelas B tertarik turun oleh nilai rendah 55, jadi rata-rata saja tidak cukup untuk menyimpulkan.`},
{n:11,t:'pg',topic:3,text:`Perhatikan gambar berikut!`,img:'img5',text2:`Bagian bernomor 1 dan 2 secara berturut-turut menunjukkan ....`,opts:[`mesin pencari dan browser`,`browser dan mesin pencari`,`internet dan browser`,`browser dan internet`],key:['B'],exp:`Nomor 1 adalah Safari (aplikasi untuk membuka situs = browser). Nomor 2 adalah Bing (situs/layanan untuk mencari informasi = mesin pencari).`},
{n:12,t:'pg',topic:3,text:`Dewi ingin mencari berkas PDF tentang resep olahan ikan. Penulisan kata kunci yang tepat adalah ....`,opts:[`resep olahan ikan pdf.filetype`,`filetype:pdf resep olahan ikan`,`site:pdf resep olahan ikan`,`"pdf" - resep olahan ikan`],key:['B'],exp:`Operator untuk membatasi jenis berkas adalah filetype:, diikuti kata kunci pencarian: filetype:pdf resep olahan ikan.`},
{n:13,t:'pg',topic:3,text:`Perhatikan tampilan hasil pencarian berikut!`,img:'img6',text2:`Hasil bernomor 3 diberi label "Iklan". Artinya hasil tersebut ....`,opts:[`pasti paling benar karena berada di atas`,`merupakan berita terbaru`,`berasal dari situs pemerintah`,`berbayar (bersponsor), bukan hasil murni`],key:['D'],exp:`Label "Iklan"/"Bersponsor" menandakan hasil berbayar. Posisinya di atas bukan jaminan kebenaran.`},
{n:14,t:'pg',topic:4,text:`Seorang teman mengirim pesan berantai seperti pada gambar. Tindakan yang paling tepat berdasarkan prinsip menilai kredibilitas informasi adalah ....`,img:'img7',opts:[`membagikan ke grup lain karena isinya tampak bermanfaat`,`menelusuri kebenarannya (penulis, tanggal, alamat situs), membandingkannya dengan situs kesehatan resmi atau situs cek fakta, baru memutuskan membagikan atau tidak`,`menunggu sampai banyak orang membagikannya lebih dulu`,`membagikannya sambil menulis "kalau salah, mohon maaf"`],key:['B'],exp:`Pesan tanpa nama penulis, tanggal, dan sumber harus diperiksa dulu (verifikasi ke sumber resmi/cek fakta) sebelum dibagikan.`},
{n:15,t:'pg',topic:4,text:`OSIS ingin membuat kampanye hemat air. Hasil survei 50 siswa: 30 siswa mandi lebih dari 10 menit dan 20 siswa kurang dari 10 menit. Rancangan kampanye digital yang paling tepat adalah ....`,opts:[`mengunggah tabel angka mentah ke media sosial tanpa penjelasan`,`mengolah data menjadi persentase (60% siswa mandi lebih dari 10 menit), menyusun kesimpulan, lalu mengemasnya menjadi poster infografis lengkap dengan sumber survei`,`membuat poster berisi ajakan saja tanpa data agar singkat`,`menyalin poster kampanye sekolah lain tanpa menyebut sumbernya`],key:['B'],exp:`Kampanye berbasis data yang baik: data diolah (30 ÷ 50 = 60%), disimpulkan, dikemas dalam infografis, dan mencantumkan sumber.`},
{n:16,t:'pg',topic:4,text:`Sebuah stasiun televisi menayangkan laporan langsung bahwa jalan tol di km 87 ditutup sementara akibat longsor, agar pengendara memilih jalur lain. Fungsi media pers yang paling tampak adalah ....`,opts:[`hiburan`,`kontrol sosial`,`informasi`,`edukasi`],key:['C'],exp:`Laporan langsung tentang penutupan jalan memberi tahu masyarakat suatu kejadian terkini, yaitu fungsi informasi.`},
{n:17,t:'pg',topic:4,text:`Sebuah majalah anak memuat rubrik tetap yang menjelaskan proses terjadinya hujan dan cara kerja gunung berapi untuk menambah wawasan pembacanya. Rubrik tersebut menjalankan fungsi ....`,opts:[`edukasi`,`hiburan`,`kontrol sosial`,`promosi`],key:['A'],exp:`Rubrik yang menjelaskan proses ilmiah untuk menambah wawasan menjalankan fungsi edukasi.`},
{n:18,t:'pg',topic:4,text:`Rina menerima pesan: "Pemerintah membagikan pulsa Rp500.000 untuk semua pelajar! Klik tautan ini dan sebarkan ke 5 grup!" Langkah pertama yang paling tepat dilakukan Rina adalah ....`,opts:[`mengeklik tautan, lalu menyebarkannya ke 5 grup`,`menunggu teman lain menyebarkannya lebih dulu`,`mengabaikan semua pesan di ponselnya selamanya`,`memeriksa pengirim dan membandingkannya dengan akun resmi pemerintah atau situs cek fakta`],key:['D'],exp:`Langkah pertama adalah memverifikasi pengirim dan membandingkan dengan akun resmi/situs cek fakta; jangan klik tautan atau menyebarkannya (ciri hoaks/penipuan).`},
{n:19,t:'pg',topic:4,text:`Dinas Perhubungan mengumumkan, "Jalan Merdeka ditutup selama 14 hari mulai 3 Maret karena perbaikan." Seorang warga berkomentar, "Menurut saya, penutupan itu sangat merepotkan." Analisis yang paling tepat adalah ....`,opts:[`keduanya fakta`,`pengumuman adalah fakta, komentar warga adalah opini`,`keduanya opini`,`pengumuman adalah opini, komentar warga adalah fakta`],key:['B'],exp:`Pengumuman memuat informasi yang dapat dibuktikan (fakta). Komentar "menurut saya … merepotkan" adalah pendapat pribadi (opini).`},
{n:20,t:'pg',topic:4,text:`Tiga siswa berdebat tentang cara menilai berita. Andi: "Berita pasti benar kalau sudah dibagikan ribuan orang." Bima: "Berita layak dipercaya kalau sumbernya jelas, menyebut narasumber, dan bisa dicek di media terpercaya lain." Candra: "Berita dengan judul paling heboh pasti paling penting." Pendapat yang paling dapat dipertanggungjawabkan adalah milik ....`,opts:[`Andi, karena jumlah pembagian membuktikan kebenaran`,`Bima, karena kebenaran diuji lewat kejelasan sumber dan perbandingan dengan media lain`,`Candra, karena judul heboh menandakan berita penting`,`Andi dan Candra, karena keduanya mewakili banyak pembaca`],key:['B'],exp:`Kredibilitas berita diuji lewat kejelasan sumber, narasumber, dan perbandingan dengan media lain; bukan dari banyaknya yang membagikan atau judul yang heboh.`},
{n:21,t:'bs',topic:1,text:`Perhatikan Gambar 5. Tentukan benar atau salah setiap pernyataan berikut!`,img:'img8',stmts:[`Sel B3 berisi 12.000.`,`Sel C2 berisi 15.000`,`Data "Bakso" berada di sel A5`],key:[true,false,true],exps:[`B3 = harga Mie Ayam = 12.000.`,`C2 = 12 (porsi Nasi Goreng); angka 15.000 ada di B2.`,`"Bakso" berada di baris 5 kolom A, yaitu A5.`]},
{n:22,t:'bs',topic:1,text:`Perhatikan Gambar 6. Tentukan benar atau salah setiap pernyataan berikut!`,img:'img9',stmts:[`Tabel tersebut adalah tabel vertikal karena memiliki empat baris.`,`Sel C2 berisi 182,0`,`Sel D3 berisi 21`],key:[false,true,true],exps:[`Judul data (Pemain, Tinggi, Jumlah Poin, Posisi) ada di kolom A dan data tiap pemain berjalan ke kanan, jadi ini tabel horizontal.`,`C2 = tinggi Eko = 182,0.`,`D3 = jumlah poin Fajar = 21.`]},
{n:23,t:'bs',topic:1,text:`Rudi mengumpulkan data 25 teman sekelas yang terdiri dari nama, hobi, jumlah hewan peliharaan, dan berat badan (kg). Evaluasilah pernyataan berikut!`,stmts:[`Tabel vertikal lebih mudah diperpanjang ke bawah jika ada teman baru.`,`Kolom jumlah hewan peliharaan dan kolom berat badan sama-sama kontinu karena berupa angka`,`Kolom hobi dapat dimasukkan ke dalam tabel dan dikelompokkan sebagai data kualitatif.`],key:[true,false,true],exps:[`Pada tabel vertikal, data baru cukup ditambahkan di baris berikutnya.`,`Jumlah hewan peliharaan adalah data diskrit (hasil menghitung); hanya berat badan yang kontinu.`,`Hobi berupa kategori/deskripsi sehingga data kualitatif.`]},
{n:24,t:'bs',topic:2,text:`Perhatikan tabel! Tentukan benar atau salah pernyataan berikut!`,img:'img10',stmts:[`=MIN(B2:B7) menghasilkan 65.`,`=MAX(B2:B7) menghasilkan 100`,`=SUM(B2:B7) menghasilkan 480`],key:[true,false,true],exps:[`Nilai terkecil = 65.`,`Nilai terbesar = 90, bukan 100.`,`Jumlah = 70+85+90+65+80+90 = 480.`]},
{n:25,t:'bs',topic:2,text:`Perhatikan tabel! Tentukan benar atau salah pernyataan berikut!`,img:'img11',stmts:[`=MIN(B2:B8) menghasilkan 26.`,`=MAX(B2:B8) menghasilkan 36.`,`=AVERAGE(B2:B8) menghasilkan 28`],key:[true,true,false],exps:[`Suhu terendah = 26.`,`Suhu tertinggi = 36.`,`Jumlah = 210; rata-rata = 210 ÷ 7 = 30, bukan 28 (28 adalah median).`]},
{n:26,t:'bs',topic:3,text:`Ani mengetik kata kunci berikut pada mesin pencari.`,img:'img12',stmts:[`Ani mencari berkas berformat PDF`,`Halaman hasil boleh memuat kata "instan"`,`Ani sedang mencari berkas dari situs berakhiran go.id`],key:[true,false,false],exps:[`filetype:pdf membatasi hasil pada berkas PDF.`,`Tanda minus (-instan) mengecualikan halaman yang memuat kata "instan".`,`Untuk membatasi situs digunakan operator site:, yang tidak ada pada kata kunci tersebut.`]},
{n:27,t:'bs',topic:4,text:`Perhatikan perbandingan dua artikel berikut. Tentukan benar atau salah setiap pernyataan`,img:'img13',stmts:[`Artikel Q layak dibagikan karena judulnya menarik perhatian.`,`Tidak adanya nama penulis dan tanggal pada Artikel Q merupakan tanda untuk waspada.`,`Artikel P lebih unggul daripada Artikel Q dalam hal penulis, tanggal, alamat situs, dan rujukan`],key:[false,true,true],exps:[`Judul menarik bukan ukuran kelayakan; Artikel Q tanpa penulis, tanggal, dan rujukan.`,`Tidak ada penulis/tanggal adalah tanda kredibilitas rendah sehingga perlu waspada.`,`Artikel P memiliki penulis (dr. Lina, Sp.GK), tanggal, alamat situs go.id, dan daftar rujukan.`]},
{n:28,t:'bs',topic:4,text:`Mira menyalin dua paragraf dari sebuah blog untuk laporan IPA tanpa mencantumkan sumber. Ia hanya mengganti beberapa kata. Tentukan benar atau salah setiap pernyataan.`,stmts:[`Menyalin tanpa mencantumkan sumber berarti tidak menghormati hak cipta pembuat tulisan.`,`Tindakan Mira sudah tepat karena sebagian kata sudah diganti`,`Mira seharusnya merangkum dengan bahasa sendiri dan mencantumkan sumber`],key:[true,false,true],exps:[`Mengambil karya orang lain tanpa menyebut sumber melanggar hak cipta.`,`Mengganti beberapa kata tetap termasuk menjiplak.`,`Cara yang benar: merangkum dengan bahasa sendiri dan mencantumkan sumber.`]},
{n:29,t:'bs',topic:4,text:`Situs "Warta Pelajar" mencantumkan nama redaksi dan penanggung jawab, menyebut narasumber di setiap berita, serta menyediakan kolom koreksi. Tentukan benar atau salah pernyataan berikut!`,stmts:[`Nama penanggung jawab membuat pembaca sulit meminta koreksi`,`Situs tersebut memiliki ciri-ciri media pers yang terpercaya`,`Kolom koreksi menunjukkan bahwa media mau memperbaiki kesalahan`],key:[false,true,true],exps:[`Penanggung jawab yang jelas justru memudahkan pembaca meminta koreksi.`,`Redaksi jelas, narasumber disebut, dan ada kolom koreksi adalah ciri media terpercaya.`,`Kolom koreksi menandakan kesediaan memperbaiki kesalahan.`]},
{n:30,t:'bs',topic:4,text:`Perhatikan pesan berantai berikut! Tentukan benar atau salah pernyataan di bawahnya!`,img:'img14',stmts:[`Pesan tersebut memuat ciri hoaks, yaitu bahasa heboh dan ajakan menyebarkan.`,`Pesan tersebut dapat dipercaya karena menyebut "seorang ahli".`,`Sebelum dibagikan, isi pesan sebaiknya dicek lewat situs cek fakta`],key:[true,false,true],exps:[`Huruf kapital berlebihan, tanda seru, dan ajakan "Sebarkan ke 20 grup" adalah ciri hoaks.`,`"Seorang ahli (tanpa nama)" tidak dapat diverifikasi sehingga tidak menambah kredibilitas.`,`Informasi mencurigakan sebaiknya dicek lewat situs cek fakta sebelum dibagikan.`]},
{n:31,t:'pg',topic:1,text:`Pernyataan yang benar tentang alamat sel di Excel adalah ....`,opts:[`Name Box digunakan untuk mengetik judul tabel`,`Alamat sel ditulis dengan huruf kolom lebih dahulu, lalu angka baris`,`Alamat sel ditulis dengan angka baris lebih dahulu, lalu huruf kolom`,`Name Box menunjukkan alamat sel yang sedang dipilih`],key:['B','D'],note:`Pilihan B dan D sama-sama benar secara materi, sehingga keduanya diterima.`,exp:`Alamat sel ditulis huruf kolom lalu angka baris (mis. B3) dan Name Box menampilkan alamat sel yang sedang dipilih. Name Box bukan untuk mengetik judul tabel.`},
{n:32,t:'pg',topic:1,text:`Perhatikan Gambar 8. Pernyataan yang benar adalah ....`,img:'img15',opts:[`Kolom C berisi data kuantitatif kontinu`,`Kolom B berisi data kualitatif`,`Kolom D berisi data kuantitatif kontinu`,`Sel C4 berisi angka 9`],key:['C'],exp:`Kolom C (Stok) adalah data diskrit; kolom B (Warna) kualitatif; kolom D (Berat, kg) kontinu karena hasil mengukur. C4 berisi 25 (angka 9 ada di C3).`},
{n:33,t:'pg',topic:1,text:`Perhatikan Gambar 10. Tabel tersebut diubah menjadi tabel horizontal dengan judul data (Nama, Jumlah Saudara, Berat (kg)) ditulis di kolom A mulai A1 secara berurutan ke bawah. Pernyataan yang benar setelah tabel diubah adalah ....`,img:'img16',opts:[`Nama "Ali" berada di sel B1`,`Jumlah saudara Budi (1) berada di sel C2`,`Berat badan Cici (38,2) berada di sel D3`,`Berat badan Ali (41,5) berada di sel B4`],key:['A','B','C'],note:`Pilihan A, B, dan C sama-sama benar sehingga ketiganya diterima.`,exp:`Setelah diubah: A1 Nama, A2 Jumlah Saudara, A3 Berat (kg); Ali di kolom B, Budi di kolom C, Cici di kolom D. Maka Ali = B1, jumlah saudara Budi = C2, berat Cici = D3 (benar). Berat Ali (41,5) berada di B3, bukan B4.`},
{n:34,t:'pg',topic:2,text:`Perhatikan tabel! Pasangan rumus dan hasil yang benar adalah ....`,img:'img17',opts:[`=MAX(B2:B7) → 90`,`=MIN(B2:B7) → 70`,`=AVERAGE(B2:B7) → 82,5`,`=MEDIAN(B2:B7) → 82,5`],key:['A','D'],note:`Pilihan A dan D sama-sama benar sehingga keduanya diterima.`,exp:`MAX = 90 (benar); MIN = 65 (bukan 70); AVERAGE = 80 (bukan 82,5); MEDIAN dari 65, 70, 80, 85, 90, 90 = (80+85)÷2 = 82,5 (benar).`},
{n:35,t:'pg',topic:2,text:`Pada tabel suhu, data hari Kamis ternyata salah catat dan diperbaiki dari 35 menjadi 56. Pernyataan yang benar setelah perbaikan adalah ....`,img:'img18',opts:[`Nilai MAX tetap 36.`,`Rata-rata naik menjadi 33.`,`Nilai MIN berubah menjadi 27.`,`Nilai MEDIAN tetap 28.`],key:['B','D'],note:`Pilihan B dan D sama-sama benar sehingga keduanya diterima.`,exp:`Data baru: 26, 28, 27, 56, 28, 36, 30. MAX menjadi 56; jumlah 231 ÷ 7 = 33 (rata-rata naik jadi 33); MIN tetap 26; median (terurut 26, 27, 28, 28, 30, 36, 56) tetap 28.`},
{n:36,t:'pg',topic:3,text:`Kamu ingin mengetahui harga tiket kereta Jakarta - Bandung tahun 2026. Kata kunci yang efektif adalah ....`,opts:[`aku mau tahu semua info tentang kereta, tolong ya`,`harga tiket kereta Jakarta Bandung`,`tiket`,`tarif kereta Jakarta Bandung 2026`],key:['D'],exp:`Kata kunci efektif singkat, spesifik, dan memuat unsur penting (jenis informasi, rute, tahun): "tarif kereta Jakarta Bandung 2026". Kalimat panjang terlalu bertele-tele dan satu kata terlalu umum.`},
{n:37,t:'pg',topic:2,text:`Perhatikan data kehadiran kelas 8B pada tabel. Kesimpulan yang dapat dibenarkan adalah ....`,img:'img19',opts:[`rata-rata kehadiran 28,4 siswa per hari`,`kehadiran terendah terjadi pada hari Rabu (25 siswa)`,`kehadiran tertinggi hanya terjadi pada hari Selasa`,`rata-rata kehadiran sekitar 94,7%`],key:['A','B','D'],note:`Pilihan A, B, dan D sama-sama benar sehingga ketiganya diterima.`,exp:`Data: 30, 29, 25, 30, 28 → jumlah 142, rata-rata 28,4 siswa (28,4 ÷ 30 ≈ 94,7%). Terendah Rabu (25). Tertinggi (30) terjadi pada Senin dan Kamis, bukan hanya Selasa.`},
{n:38,t:'pg',topic:4,text:`Kamu ditugaskan membuat konten edukasi "Waspada Hoaks" untuk akun Instagram sekolah. Rancangan yang tepat adalah ....`,opts:[`membuat infografis berjudul bombastis tanpa sumber agar cepat viral`,`mengumpulkan data (misalnya survei jenis hoaks yang diterima siswa), mengolahnya menjadi persentase, lalu merancang infografis`,`menyalin infografis akun lain dan hanya mengganti warnanya`,`mencantumkan sumber data, tanggal, dan cara cek fakta (misalnya turnbackhoax.id)`],key:['B','D'],note:`Pilihan B dan D sama-sama rancangan yang tepat sehingga keduanya diterima.`,exp:`Konten edukasi yang baik berbasis data (survei → persentase → infografis) dan mencantumkan sumber, tanggal, serta cara cek fakta. Judul bombastis tanpa sumber dan menyalin karya orang lain tidak tepat.`},
{n:39,t:'mcq',topic:4,need:3,text:`Kamu menerima kabar viral di grup kelas. Pilihlah 3 langkah "saring sebelum sharing" yang tepat!`,opts:[`Memeriksa siapa pembuat dan sumber kabar tersebut`,`Membaca isi sampai habis, tidak hanya judulnya`,`Membagikannya dulu, baru mengecek jika ada yang bertanya`,`Membandingkannya dengan media terpercaya atau situs cek fakta`],key:['A','B','D'],exp:`Saring sebelum sharing: periksa pembuat/sumber, baca sampai habis, dan bandingkan dengan media terpercaya/cek fakta. Membagikan dulu baru mengecek adalah kebalikannya.`},
{n:40,t:'mcq',topic:4,need:2,text:`Perhatikan unggahan media sosial berikut! Pilihlah 2 ciri hoaks yang tampak pada unggahan tersebut!`,img:'img20',opts:[`Judul heboh dan memancing emosi`,`Menyebut data resmi lengkap dengan tautan rujukan`,`Ada ajakan untuk segera membagikan`,`Memuat klarifikasi dari lembaga resmi`],key:['A','C'],exp:`Unggahan memakai "HEBOH!!" (judul heboh) dan "BAGIKAN sebelum dihapus!" (ajakan segera membagikan). Tidak ada data resmi, rujukan, maupun klarifikasi lembaga resmi.`}
];

const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},

/* ================= grading ================= */
function gradeQ(q,a){
 if(q.t==='pg'){if(!a)return{pts:0,st:'kosong'};const ok=q.key.includes(a);return{pts:ok?1:0,st:ok?'benar':'salah'}}
 if(q.t==='bs'){if(!a||a.every(v=>v==null))return{pts:0,st:'kosong'};const n=a.filter((v,i)=>v===q.key[i]).length;const p=n/q.key.length;return{pts:p,st:p===1?'benar':'salah'}}
 if(q.t==='mcq'){if(!a||!a.length)return{pts:0,st:'kosong'};const r=a.filter(x=>q.key.includes(x)).length,w=a.length-r;const p=Math.max(0,(r-w)/q.key.length);return{pts:p,st:p===1?'benar':'salah'}}
}
function gradeAll(ans){
 const items=Q.map((q,i)=>gradeQ(q,ans[i]));
 const sum=items.reduce((s,x)=>s+x.pts,0);
 const topics={};TOPICS.forEach(t=>topics[t.id]={pts:0,n:0});
 const types={pg:{pts:0,n:0},bs:{pts:0,n:0},mcq:{pts:0,n:0}};
 Q.forEach((q,i)=>{topics[q.topic].pts+=items[i].pts;topics[q.topic].n++;types[q.t].pts+=items[i].pts;types[q.t].n++});
 return{items,sum,nilai:Math.round(sum/TOTAL*1000)/10,benar:items.filter(x=>x.st==='benar').length,salah:items.filter(x=>x.st==='salah').length,kosong:items.filter(x=>x.st==='kosong').length,topics,types};
}
function isAns(i){const a=session.answers[i],q=Q[i];if(q.t==='pg')return !!a;if(q.t==='bs')return !!a&&a.some(v=>v!=null);return !!a&&a.length>0}
function isComplete(i){const a=session.answers[i],q=Q[i];if(q.t==='pg')return !!a;if(q.t==='bs')return !!a&&a.every(v=>v!=null)&&a.length===q.key.length;return !!a&&a.length===q.need}

/* ================= audio alarm ================= */
let actx=null,siren=null,away=false,awayStart=0;
function unlockAudio(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume()}catch(e){}}
function startSiren(secs=60){
 if(!settings.alarm)return;unlockAudio();if(!actx||siren)return;
 try{actx.resume();const g=actx.createGain();g.gain.value=.55;const o=actx.createOscillator();o.type='square';o.connect(g);g.connect(actx.destination);
 const t0=actx.currentTime+.02,step=.3,n=Math.floor(secs/step);
 for(let i=0;i<n;i++)o.frequency.setValueAtTime(i%2?740:1180,t0+i*step);
 o.start(t0);o.stop(t0+secs);siren={o,g};o.onended=()=>{if(siren&&siren.o===o)siren=null}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(Array(40).fill(300))}catch(e){}
}
function stopSiren(){if(siren){try{siren.o.stop()}catch(e){}siren=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function beep(){unlockAudio();if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.4,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.6)}catch(e){}}
function testAlarm(){const was=settings.alarm;settings.alarm=true;startSiren(2.4);settings.alarm=was;setTimeout(stopSiren,2400);toast('Alarm diuji selama 2 detik. Pastikan volume perangkat cukup keras.')}

function donutSvg(tp){
 const R=52,C=2*Math.PI*R;let off=0;let segs='';
 if(!tp)segs=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="#e3e9f6" stroke-width="22"/>`;
 else{const sum=tp.reduce((s,x)=>s+x.pct,0)||1;tp.forEach(t=>{const len=C*t.pct/sum;segs+=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${t.color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${t.name}: ${t.pct}%</title></circle>`;off+=len})}
 return `<svg viewBox="0 0 140 140">${segs}</svg>`}

 let ans=0,inc=0,fl=Object.keys(session.flags).length;Q.forEach((_,k)=>{if(isAns(k)){ans++;if(!isComplete(k))inc++}});
 modal({html:`<h3>Selesaikan ujian?</h3><p style="color:#475569;margin:0">Setelah dikumpulkan, jawaban tidak dapat diubah.</p>
 <div class="sumg"><div><b style="color:#16a34a">${ans}</b><span>Terjawab</span></div><div><b style="color:#dc2626">${TOTAL-ans}</b><span>Belum dijawab</span></div><div><b style="color:#d97706">${fl}</b><span>Ragu-ragu</span></div></div>
 ${inc?`<p style="color:#d97706;font-size:13px;margin:0">⚠ ${inc} soal belum dijawab lengkap (pernyataan/pilihan belum penuh).</p>`:''}
 ${TOTAL-ans?`<p style="color:#dc2626;font-size:13px;margin:6px 0 0">Masih ada ${TOTAL-ans} soal kosong.</p>`:''}
 <p style="font-size:12.5px;color:#64748b;margin:8px 0 0">Sisa waktu: ${hms(session.end-Date.now())}</p>`,
 actions:[{label:'Kembali Mengerjakan',cls:'gray'},{label:'Ya, Selesai Ujian',cls:'red',fn:()=>finishExam(false)}]});
}
function finishExam(auto){
 clearInterval(tickT);stopSiren();flashTitle(false);away=false;
 const s=session,g=gradeAll(s.answers);const end=Math.min(Date.now(),s.end);
 const entry={id:s.id,start:s.start,end,used:end-s.start,dur:s.dur,viol:s.viol||0,auto:!!auto,nama:profile.nama,kelas:profile.kelas,answers:s.answers,flags:s.flags,items:g.items.map(x=>x.st),nilai:g.nilai,sum:g.sum,benar:g.benar,salah:g.salah,kosong:g.kosong,topics:g.topics,types:g.types};
 history.unshift(entry);history=history.slice(0,30);saveHist();session=null;saveSess();warned5=warned1=false;
 $$('.ovl').forEach(o=>o.remove());
 showResult(entry.id,auto);
}

/* ================= result ================= */
function showResult(id,auto){
 const h=history.find(x=>x.id===id);if(!h)return go('dashboard');
 const g=gradeAll(h.answers);const ok=h.nilai>=KKM;const C=2*Math.PI*60;
 $('#vResult').innerHTML=`<div class="res"><div class="noprint" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">${logoHtml.replace('padding:0','')}<span style="flex:1"></span><button class="btn sec" id="rBack">${ic('home')}Dashboard</button><button class="btn sec" id="rPrint">${ic('print')}Cetak / Simpan PDF</button><button class="btn" id="rAgain">${ic('redo')}Ulangi Ujian</button></div>
 ${auto?'<div class="resume" style="margin-bottom:14px">⏰ <b>Waktu habis — jawaban dikumpulkan otomatis.</b></div>':''}
 <div class="rhead"><div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="12"/><circle cx="70" cy="70" r="60" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*h.nilai/100} ${C}"/></svg><div class="v"><b>${h.nilai}</b><span>dari 100</span></div></div>
 <div><h2>Hasil Latihan SAS Informatika</h2><div style="opacity:.92">${esc(h.nama)}${h.kelas?' · '+esc(h.kelas):''} · ${dfmt(h.end,{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div><span class="stt ${ok?'ok':'no'}">${ok?'LULUS':'PERLU REMEDIAL'} (KKM ${KKM})</span><div style="font-size:13px;opacity:.95">Total poin ${Math.round(h.sum*100)/100} dari ${TOTAL}</div></div></div>
 <div class="sg"><div class="sc g"><b>${h.benar}</b><span>Benar</span></div><div class="sc r"><b>${h.salah}</b><span>Salah / Sebagian</span></div><div class="sc y"><b>${h.kosong}</b><span>Kosong</span></div><div class="sc b"><b>${Math.round(h.sum*10)/10}</b><span>Skor Poin</span></div><div class="sc"><b style="font-size:17px;padding:5px 0">${dur(h.used)}</b><span>Waktu Mengerjakan</span></div><div class="sc ${h.viol?'r':'g'}"><b>${h.viol}</b><span>Keluar Halaman</span></div></div>
 <div class="grid2"><section class="card"><h3>Kinerja per Topik</h3>${topicPct(h).map(t=>`<div class="mrow"><div class="l"><span>${t.name}</span><b>${t.pct}%</b></div><div class="bar"><i style="width:${t.pct}%;background:${t.color}"></i></div></div>`).join('')}</section>
 <section class="card"><h3>Kinerja per Tipe Soal</h3>${[['pg','Pilihan Ganda'],['bs','Benar / Salah'],['mcq','PG Kompleks']].map(([k,n])=>{const p=Math.round(h.types[k].pts/h.types[k].n*100);return `<div class="mrow"><div class="l"><span>${n} (${h.types[k].n} soal)</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</section></div>
 <h2 style="margin:22px 0 0;font-size:20px">Pembahasan</h2>
 <div class="flt noprint" id="flt"><button class="on" data-f="all">Semua (${TOTAL})</button><button data-f="benar">Benar (${h.benar})</button><button data-f="salah">Salah (${h.salah})</button><button data-f="kosong">Kosong (${h.kosong})</button></div>
 <div id="rlist">${Q.map((q,i)=>{const st=g.items[i].st,a=h.answers[i];
  const keyTxt=q.t==='bs'?q.key.map((v,k)=>`${k+1}. ${v?'Benar':'Salah'}`).join(' · '):q.key.join(' / ')+(q.t==='mcq'?' (semua)':'');
  const yourTxt=st==='kosong'?'Tidak dijawab':q.t==='bs'?a.map((v,k)=>`${k+1}. ${v==null?'–':v?'Benar':'Salah'}`).join(' · '):q.t==='pg'?a:a.join(', ');
  return `<div class="rq" data-st="${st}"><div class="qcard rv"><div class="qhead"><span class="qno">Soal ${q.n}</span><span class="badge">${q.t==='pg'?'Pilihan Ganda':q.t==='bs'?'Benar / Salah':'PG Kompleks'}</span><span class="stbadge ${st}">${st==='benar'?'Benar':st==='salah'?(g.items[i].pts>0?'Sebagian benar ('+Math.round(g.items[i].pts*100)/100+')':'Salah'):'Kosong'}</span></div>
  ${qBodyHtml(q,a,'review')}
  <div class="ans-line"><b>Jawaban Anda:</b> ${esc(yourTxt)} &nbsp;|&nbsp; <b style="color:#16a34a">Kunci:</b> ${esc(keyTxt)}</div>
  <div class="pemb"><b>Pembahasan:</b> ${esc(q.exp||'')}${q.exps?'<ul style="margin:6px 0 0;padding-left:18px">'+q.exps.map((e,k)=>`<li>Pernyataan ${k+1} → <b>${q.key[k]?'Benar':'Salah'}</b>. ${esc(e)}</li>`).join('')+'</ul>':''}${q.note?`<div style="margin-top:6px;color:#b45309">ℹ ${esc(q.note)}</div>`:''}</div></div></div>`}).join('')}</div></div>`;
 showView('vResult');
 $('#rBack').onclick=()=>{showView('vShell');go('dashboard')};
 $('#rPrint').onclick=()=>window.print();
 $('#rAgain').onclick=()=>{showView('vShell');go('start')};
 $('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#flt button').forEach(x=>x.classList.toggle('on',x===b));$$('#rlist .rq').forEach(r=>r.classList.toggle('hide',b.dataset.f!=='all'&&r.dataset.st!==b.dataset.f))};
 $$('#rlist .qimg').forEach(im=>im.onclick=()=>{const o=modal({html:''});o.classList.add('lbx');o.innerHTML=`<img src="${im.src}" alt=""/>`;o.onclick=()=>o.remove()});
}
function pResultsEmpty(el){el.innerHTML=`<div class="pg-h"><h2>Hasil</h2></div><div class="card empty" style="min-height:260px;flex-direction:column;gap:14px">Belum ada hasil ujian. Kerjakan ujian terlebih dahulu.<button class="btn" id="eB">${ic('file')}Mulai Ujian</button></div>`;$('#eB').onclick=()=>go('start')}

/* ================= history / analytics / material / profile / settings ================= */
function pHistory(el){
 el.innerHTML=`<div class="pg-h"><h2>Riwayat Ujian</h2><div class="sp">${history.length?`<button class="btn sec" id="hClr">${ic('trash')}Hapus Semua</button>`:''}</div></div>
 <section class="card">${history.length?`<div class="tbw"><table class="tb"><thead><tr><th>#</th><th>Tanggal</th><th>Ujian</th><th>Nilai</th><th>Benar</th><th>Salah</th><th>Kosong</th><th>Durasi</th><th>Keluar Halaman</th><th>Status</th><th></th></tr></thead><tbody>`+history.map((h,i)=>`<tr><td>${history.length-i}</td><td>${dfmt(h.end,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>Latihan SAS Informatika</td><td><b>${h.nilai}</b></td><td>${h.benar}</td><td>${h.salah}</td><td>${h.kosong}</td><td>${dur(h.used)}</td><td>${h.viol}×</td><td><span class="tag ${h.nilai>=KKM?'live':'up'}">${h.nilai>=KKM?'Lulus':'Remedial'}</span></td><td style="white-space:nowrap"><button class="btn sm" data-v="${h.id}">Lihat</button> <button class="btn sm gray" data-d="${h.id}" aria-label="Hapus">${ic('trash')}</button></td></tr>`).join('')+`</tbody></table></div>`:`<div class="empty" style="min-height:200px">Belum ada riwayat ujian.</div>`}</section>`;
 $$('[data-v]',el).forEach(b=>b.onclick=()=>showResult(+b.dataset.v));
 $$('[data-d]',el).forEach(b=>b.onclick=()=>modal({html:'<h3>Hapus riwayat ini?</h3>',actions:[{label:'Batal',cls:'gray'},{label:'Hapus',cls:'red',fn:()=>{history=history.filter(x=>x.id!==+b.dataset.d);saveHist();pHistory(el);refreshTop()}}]}));
 if($('#hClr'))$('#hClr').onclick=()=>modal({html:'<h3>Hapus semua riwayat?</h3><p style="color:#475569">Tindakan ini tidak dapat dibatalkan.</p>',actions:[{label:'Batal',cls:'gray'},{label:'Hapus Semua',cls:'red',fn:()=>{history=[];saveHist();pHistory(el);refreshTop()}}]});
}
function pAnalytics(el){
 if(!history.length){el.innerHTML=`<div class="pg-h"><h2>Analitik</h2></div><div class="card empty" style="min-height:260px;flex-direction:column;gap:14px">Analitik muncul setelah Anda menyelesaikan ujian.<button class="btn" id="eB">${ic('file')}Mulai Ujian</button></div>`;$('#eB').onclick=()=>go('start');return}
 const L=history.slice(0,8).reverse();const best=Math.max(...history.map(h=>h.nilai)),avg=Math.round(history.reduce((s,h)=>s+h.nilai,0)/history.length*10)/10;
 const wrong=Q.map((q,i)=>({q,c:history.filter(h=>h.items[i]!=='benar').length})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c||a.q.n-b.q.n).slice(0,6);
 const agg={};TOPICS.forEach(t=>agg[t.id]={p:0,n:0});history.forEach(h=>TOPICS.forEach(t=>{agg[t.id].p+=h.topics[t.id].pts;agg[t.id].n+=h.topics[t.id].n}));
 el.innerHTML=`<div class="pg-h"><h2>Analitik</h2></div>
 <div class="stats" style="margin-bottom:16px"><div class="st card"><div class="ico" style="background:#2563eb">${ic('file')}</div><b>${history.length}</b><span class="lb">Total Ujian</span></div><div class="st card"><div class="ico" style="background:#16a34a">${ic('award')}</div><b>${avg}</b><span class="lb">Rata-rata</span></div><div class="st card"><div class="ico" style="background:#f59f00">${ic('star')}</div><b>${best}</b><span class="lb">Nilai Tertinggi</span></div><div class="st card"><div class="ico" style="background:#7c4dff">${ic('alert')}</div><b>${history.reduce((s,h)=>s+h.viol,0)}</b><span class="lb">Total Keluar Halaman</span></div></div>
 <div class="grid2"><section class="card"><h3>Nilai per Ujian</h3><div class="hb">${L.map(h=>`<div><b>${h.nilai}</b><i style="height:${h.nilai*.9}%"></i>${dfmt(h.end,{day:'2-digit',month:'short'})}</div>`).join('')}</div></section>
 <section class="card"><h3>Penguasaan Topik (rata-rata semua ujian)</h3>${TOPICS.map(t=>{const p=Math.round(agg[t.id].p/agg[t.id].n*100);return `<div class="mrow"><div class="l"><span>${t.name}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%;background:${t.color}"></i></div></div>`}).join('')}</section>
 <section class="card"><h3>Tren Nilai</h3>${trendSvg(history)}</section>
 <section class="card"><h3>Soal yang Sering Salah / Kosong</h3>${wrong.length?wrong.map(x=>`<div class="ut"><div class="d"><b>${x.q.n}</b><span>SOAL</span></div><div class="t"><b style="font-weight:500">${esc((x.q.text||x.q.text2).slice(0,80))}${(x.q.text||x.q.text2).length>80?'…':''}</b><span>Tidak tepat ${x.c} dari ${history.length} ujian</span></div></div>`).join(''):'<div class="empty">Semua soal dijawab benar. Hebat!</div>'}</section></div>`;
}
const MATERI=[
{t:'Jenis Data & Tabel',k:'kualitatif kuantitatif diskrit kontinu sel alamat name box tabel vertikal horizontal',h:`<ul class="ls"><li><b>Kualitatif</b>: berupa kategori/deskripsi (merek, warna, hobi).</li><li><b>Kuantitatif diskrit</b>: hasil <i>menghitung</i>, bilangan bulat (jumlah ayam, stok).</li><li><b>Kuantitatif kontinu</b>: hasil <i>mengukur</i>, dapat desimal (berat, tinggi, kecepatan).</li><li><b>Sel</b> = pertemuan kolom dan baris. Alamat sel: huruf kolom lalu angka baris (mis. <code>B3</code>). <b>Name Box</b> menampilkan alamat sel yang dipilih.</li><li><b>Tabel vertikal</b>: judul di baris 1, data bertambah ke bawah. <b>Tabel horizontal</b>: judul di kolom A, data berjalan ke kanan.</li></ul>`},
{t:'Rumus Statistik Excel',k:'max min average median sum rumus rata-rata',h:`<ul class="ls"><li><code>=MAX(B2:B7)</code> nilai terbesar; <code>=MIN(B2:B7)</code> nilai terkecil.</li><li><code>=SUM(B2:B7)</code> jumlah; <code>=AVERAGE(B2:B7)</code> rata-rata = jumlah ÷ banyak data.</li><li><code>=MEDIAN(B2:B7)</code> nilai tengah setelah data diurutkan (jika genap: rata-rata dua nilai tengah).</li><li>Median tidak terpengaruh nilai ekstrem, sedangkan rata-rata terpengaruh.</li></ul>`},
{t:'Pencarian Informasi',k:'browser mesin pencari kata kunci filetype site iklan bersponsor',h:`<ul class="ls"><li><b>Browser</b> adalah aplikasi untuk membuka situs (mis. Safari, Chrome); <b>mesin pencari</b> adalah layanan pencari informasi (mis. Bing, Google).</li><li>Operator: <code>filetype:pdf</code> membatasi jenis berkas, <code>-kata</code> mengecualikan kata, <code>site:</code> membatasi situs.</li><li>Kata kunci efektif: singkat, spesifik, memuat unsur penting (topik, lokasi, tahun).</li><li>Hasil berlabel <b>Iklan/Bersponsor</b> adalah hasil berbayar, bukan otomatis paling benar.</li></ul>`},
{t:'Literasi Digital: Hoaks & Kredibilitas',k:'hoaks cek fakta saring sebelum sharing fakta opini kredibilitas hak cipta media pers infografis',h:`<ul class="ls"><li><b>Ciri hoaks</b>: judul heboh, memancing emosi, ajakan menyebarkan, tanpa penulis/tanggal/sumber jelas.</li><li><b>Saring sebelum sharing</b>: periksa pembuat &amp; sumber, baca sampai habis, bandingkan dengan media terpercaya/situs cek fakta.</li><li><b>Fakta</b> dapat dibuktikan; <b>opini</b> adalah pendapat pribadi.</li><li><b>Fungsi pers</b>: informasi, edukasi, hiburan, kontrol sosial.</li><li><b>Hak cipta</b>: jangan menyalin tanpa sumber; rangkum dengan bahasa sendiri dan cantumkan sumber.</li><li><b>Infografis</b>: kumpulkan data → olah (persentase) → simpulkan → kemas → cantumkan sumber.</li></ul>`}];
function pMaterial(el){el.innerHTML=`<div class="pg-h"><h2>Materi Belajar</h2></div><div class="grid2 mat">${MATERI.map(m=>`<section class="card"><h3>${ic('book')}${m.t}</h3>${m.h}</section>`).join('')}</div>`}
function pProfile(el){
 el.innerHTML=`<div class="pg-h"><h2>Profil</h2></div><div class="grid2"><section class="card" style="text-align:center">${avatar(110)}<h3 style="margin-top:12px;font-size:18px">${esc(profile.nama)}</h3><div style="color:var(--muted)">${esc(profile.kelas||'')}</div><div class="pfp" style="margin-top:18px"><span>Kelengkapan Profil</span><b>${profCompl()}%</b></div><div class="bar"><i style="width:${profCompl()}%"></i></div></section>
 <section class="card"><div class="fld"><label>Nama Lengkap</label><input id="pN" value="${esc(profile.nama)}"/></div><div class="fld"><label>Nomor Induk / No. Absen</label><input id="pI" value="${esc(profile.nis||'')}"/></div><div class="fld"><label>Kelas</label><input id="pK" value="${esc(profile.kelas||'')}"/></div><div class="fld"><label>Sekolah</label><input id="pS" value="${esc(profile.sekolah||'')}"/></div><div class="fld"><label>Email</label><input id="pE" type="email" value="${esc(profile.email||'')}"/></div><button class="btn" id="pSv">Simpan Profil</button></section></div>`;
 $('#pSv').onclick=()=>{const n=$('#pN').value.trim();if(!n){toast('Nama wajib diisi');return}profile={nama:n,nis:$('#pI').value.trim(),kelas:$('#pK').value.trim(),sekolah:$('#pS').value.trim(),email:$('#pE').value.trim()};LS.set('cbt_profile',profile);refreshTop();toast('Profil disimpan');pProfile(el)}}
function pSettings(el){
 el.innerHTML=`<div class="pg-h"><h2>Pengaturan</h2></div><div class="grid2"><section class="card"><h3>Ujian</h3><div class="fld"><label>Durasi ujian (menit)</label><input id="sD" type="number" min="5" max="240" value="${settings.dur}"/></div>
 <div class="chk"><input type="checkbox" id="sA" ${settings.alarm?'checked':''}/><label for="sA">Bunyikan alarm jika membuka tab atau aplikasi lain saat ujian</label></div>
 <div class="fld"><label>Ukuran huruf soal</label><select id="sF"><option value="0.9">Kecil</option><option value="1">Normal</option><option value="1.15">Besar</option><option value="1.3">Sangat besar</option></select></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sec" id="sT">${ic('vol')}Tes Alarm</button><button class="btn" id="sSv">Simpan</button></div>
 ${session?'<p style="color:#d97706;font-size:12.5px">Durasi baru berlaku untuk ujian berikutnya.</p>':''}</section>
 <section class="card"><h3>Data</h3><p style="color:#475569;margin-top:0">Riwayat dan profil tersimpan di peramban perangkat ini.</p><button class="btn red" id="sR">${ic('trash')}Reset Semua Data</button></section></div>`;
 const fs=[.9,1,1.15,1.3];$('#sF').value=String(fs.reduce((a,b)=>Math.abs(b-settings.font)<Math.abs(a-settings.font)?b:a));
 $('#sT').onclick=testAlarm;
 $('#sSv').onclick=()=>{const d=Math.round(+$('#sD').value);if(!(d>=5&&d<=240)){toast('Durasi harus 5–240 menit');return}settings.dur=d;settings.alarm=$('#sA').checked;settings.font=+$('#sF').value;saveSet();document.documentElement.style.setProperty('--fs',settings.font);toast('Pengaturan disimpan')};
 $('#sR').onclick=()=>modal({html:'<h3>Reset semua data?</h3><p style="color:#475569">Profil, riwayat, dan pengaturan akan dihapus.</p>',actions:[{label:'Batal',cls:'gray'},{label:'Reset',cls:'red',fn:()=>{['cbt_profile','cbt_settings','cbt_history','cbt_session','cbt_nread'].forEach(k=>LS.del(k));location.reload()}}]})}

/* ================= boot ================= */
(function boot(){
 if(profile){enterShell();if(session){if(Date.now()>=session.end){finishExam(true)}}}
 else showLogin();
})();

</script>
</body>
</html>
